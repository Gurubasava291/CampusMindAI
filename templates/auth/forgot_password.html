{% extends "base.html" %}

{% block title %}Reset Password | CampusPulse DSU{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 1.5rem; color: var(--forest-green-dark);">Reset your password</h2>
            <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 6px;">Use the verification code sent to your account email.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="action" value="send_code">
            <label for="request_identifier" style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px;">Email or Username</label>
            <input type="text" id="request_identifier" name="identifier" required value="{{ identifier }}" autocomplete="username"
                   style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-family: inherit; font-size: 0.9375rem; margin-bottom: 16px;">
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">Send verification code</button>
        </form>

        {% if code_requested %}
        <form method="POST" action="{{ url_for('auth.forgot_password') }}" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light);">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="action" value="reset_password">
            <input type="hidden" name="identifier" value="{{ identifier }}">
            <div style="margin-bottom: 14px;">
                <label for="code" style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px;">6-digit verification code</label>
                <input type="text" id="code" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"
                       style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-family: inherit; font-size: 0.9375rem;">
            </div>
            <div style="margin-bottom: 14px;">
                <label for="password" style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px;">New password (minimum 8 characters)</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                       style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-family: inherit; font-size: 0.9375rem;">
            </div>
            <div style="margin-bottom: 18px;">
                <label for="confirm_password" style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px;">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password"
                       style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-family: inherit; font-size: 0.9375rem;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">Set new password</button>
        </form>
        {% endif %}

        <div style="text-align: center; margin-top: 20px; font-size: 0.8125rem;">
            <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--forest-green);">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
